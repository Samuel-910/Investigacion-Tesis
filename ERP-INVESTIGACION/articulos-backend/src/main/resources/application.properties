spring.application.name=articulos

# Perfil activo por defecto (puedes cambiarlo a 'supabase' cuando lo necesites)
spring.profiles.active=local
spring.main.allow-bean-definition-overriding=true

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8085
jwt.private-key-path=classpath:certs/private.pem
jwt.public-key-path=classpath:certs/public.pem
jwt.expiration=1800000
security.max-failed-attempts=5
security.block-duration-minutes=15
security.suspicious-ip-change-hours=1
security.max-concurrent-sessions=3
spring.application.name=articulos

# Perfil activo por defecto (puedes cambiarlo a 'supabase' cuando lo necesites)
spring.profiles.active=local
spring.main.allow-bean-definition-overriding=true

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8085
jwt.private-key-path=classpath:certs/private.pem
jwt.public-key-path=classpath:certs/public.pem
jwt.expiration=1800000
security.max-failed-attempts=5
security.block-duration-minutes=15
security.suspicious-ip-change-hours=1
security.max-concurrent-sessions=3

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
logging.pattern.console=%5p %-40.40logger{39} : %m%n


# Archivos
archivos.directorio=/var/laboratorio/archivos
archivos.max-size=10MB


# Cambiar la ruta de la interfaz de usuario (por defecto es /swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
# Cambiar la ruta de la definición de OpenAPI en JSON
springdoc.api-docs.path=/v3/api-docs
# Timezone
spring.jackson.time-zone=America/Lima
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=articulos-compras-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Flyway Configuration
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false

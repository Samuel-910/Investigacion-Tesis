<app-header></app-header>
<div class="h-full bg-slate-50 dark:bg-slate-900 pt-16 transition-colors duration-300">
    <app-sidebar></app-sidebar>
    <div [style.padding-left]="(sidebarService.isOpen$ | async) ? '290px' : '20px'"
        class="p-4 md:p-6 min-w-0 transition-all duration-300 ease-in-out">


        <app-breadcrumb [items]="breadcrumbItems()"></app-breadcrumb>

        <div
            class="w-full bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700">

            <app-page-header [title]="title()" [subtitle]="subtitle()" [showCounter]="false">
            </app-page-header>
            <div
                class="flex items-center p-1.5 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 w-fit mb-10 group">
                <button (click)="setStep(1)"
                    [class]="activeStep() === 1 ? 'bg-sky-500 text-white shadow-lg shadow-sky-500/30' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50'"
                    class="px-8 py-3 rounded-xl text-sm font-black transition-all duration-300 flex items-center gap-3">
                    <span class="w-6 h-6 rounded-lg bg-white/20 flex items-center justify-center text-xs">01</span>
                    <i class="fas fa-file-excel text-lg"></i>
                    REPORTE Y EXPORTACIÓN
                </button>
                <div class="w-8 h-[2px] bg-slate-100 dark:bg-slate-700 mx-2"></div>
                <button (click)="setStep(2)"
                    [class]="activeStep() === 2 ? 'bg-sky-500 text-white shadow-lg shadow-sky-500/30' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50'"
                    class="px-8 py-3 rounded-xl text-sm font-black transition-all duration-300 flex items-center gap-3">
                    <span class="w-6 h-6 rounded-lg bg-white/20 flex items-center justify-center text-xs">02</span>
                    <i class="fas fa-chart-line text-lg"></i>
                    ANÁLISIS ESTADÍSTICO
                </button>
            </div>

            <!-- STEP 1: REPORT & EXPORT -->
            <div *ngIf="activeStep() === 1" class="animate-in fade-in slide-in-from-bottom-6 duration-700">
                <!-- Tabla de Listado (Content Projection) -->
                <div class="bg-white dark:bg-slate-800 rounded-[2.5rem] overflow-hidden border border-slate-100 dark:border-slate-700 shadow-sm">
                    <div class="px-8 py-6 border-b border-slate-100 dark:border-slate-700 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="flex items-center gap-4 w-full md:w-1/2">
                            <!-- Buscador Compartido (Movido a la izquierda) -->
                            <div class="w-full max-w-md">
                                <app-search-generic [options]="searchOptions()" placeholder="Buscar en este reporte..."
                                    (onSearch)="onSearchChange($event)">
                                </app-search-generic>
                            </div>
                            <span class="px-3 py-1 bg-slate-100 dark:bg-slate-900 text-[10px] font-black rounded-lg text-slate-500 uppercase tracking-widest whitespace-nowrap">
                                {{totalItems()}} TOTAL
                            </span>
                        </div>

                            <div class="flex items-center gap-4 w-full md:w-auto">
                                <button type="button" (click)="filterDrawer.openDrawer()"
                                    class="group relative bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 px-5 py-2.5 rounded-xl font-black transition-all hover:bg-slate-50 dark:hover:bg-slate-700 shadow-sm flex items-center gap-2 text-[10px] whitespace-nowrap">
                                    <i class="fas fa-sliders-h text-sky-500"></i>
                                    FILTROS
                                    <span *ngIf="activeFiltersCount() > 0" class="absolute -top-2 -right-2 w-5 h-5 bg-sky-500 text-white rounded-full flex items-center justify-center text-[9px] font-black shadow-sm">
                                        {{activeFiltersCount()}}
                                    </span>
                                </button>
                                
                                <button (click)="handleExportar()" [disabled]="loading()"
                                    class="flex items-center gap-2 px-5 py-2.5 bg-slate-900 dark:bg-sky-500 text-white hover:bg-slate-800 dark:hover:bg-sky-400 rounded-xl text-[10px] font-black transition-all duration-300 shadow-sm whitespace-nowrap">
                                    <i class="fas fa-file-export" [class.fa-spinner]="loading()" [class.fa-spin]="loading()"></i>
                                    {{ loading() ? '...' : exportButtonText() }}
                                </button>

                            </div>
                        </div>

                        <!-- Filtros Avanzados (Solo Renderiza Tags y Drawer) -->
                        <div class="px-8 pt-4">
                            <app-advanced-filter-drawer #filterDrawer
                                [hideTrigger]="true"
                                [showClasificacion]="false"
                                [showUbicacion]="true"
                                [showPuntoVenta]="true"
                                [showMesAnio]="true"
                                [mesOptions]="mesOptions"
                                [anioOptions]="anioOptions"
                                [sucursalOptions]="sucursalOptions()"
                                [puntoVentaOptions]="puntoOptions()"
                                [initialSucursalId]="initialSucursalIdParsed"
                                [initialPuntoVentaId]="initialPuntoVentaIdParsed"
                                [initialMes]="mes()"
                                [initialAnio]="anio()"
                                [showFechas]="false"
                                [showOperacion]="false"
                                [showDocumento]="false"
                                [showEstado]="false"
                                (onApplyFilters)="onApplyAdvancedFilters($event)"
                                (activeFiltersCount)="activeFiltersCount.set($event)">
                            </app-advanced-filter-drawer>
                        </div>

                        <div class="overflow-x-auto custom-scrollbar-container">
                            <ng-content select="[table]"></ng-content>
                        </div>

                        <!-- Paginación Compartida -->
                        <div *ngIf="totalPages() > 0"
                            class="px-8 py-4 border-t border-slate-100 dark:border-slate-700 bg-slate-50/30 dark:bg-slate-900/30">
                            <app-pagination [currentPage]="currentPage()" [totalPages]="totalPages()"
                                [pageSize]="itemsPerPage()" [recordsLabel]="'documentos'"
                                (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
                            </app-pagination>
                        </div>
                    </div>
                </div>

            <!-- STEP 2: STATISTICS -->
            <div *ngIf="activeStep() === 2" class="animate-in fade-in slide-in-from-right-8 duration-700">
                <div class="flex justify-end mb-4">
                    <button (click)="goToPersonalizar()"
                        class="px-5 py-2.5 bg-sky-500 text-white rounded-xl hover:bg-sky-600 transition-all flex items-center gap-2 text-sm font-bold shadow-lg shadow-sky-500/30">
                        <i class="fas fa-edit"></i> Personalizar Análisis Estadístico
                    </button>
                </div>
                <app-dashboard-viewer [categoria]="dashboardCategory()"></app-dashboard-viewer>
            </div>
        </div>
    </div>
</div>

<div *ngIf="isColumnModalOpen()"
    class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-300">
    <div
        class="bg-white dark:bg-slate-800 rounded-[2.5rem] w-full max-w-5xl overflow-hidden shadow-2xl border border-slate-100 dark:border-slate-700 animate-in zoom-in-95 duration-300">
        <div
            class="p-8 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50/50 dark:bg-slate-900/50">
            <div>
                <h4 class="text-xl font-black text-slate-900 dark:text-white">Editar Columnas</h4>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Seleccione las columnas a
                    visualizar</p>
            </div>
            <button (click)="cancelColumnChanges()"
                class="w-10 h-10 rounded-xl bg-white dark:bg-slate-800 shadow-sm flex items-center justify-center text-slate-400 hover:text-rose-500 transition-colors">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="p-8 max-h-[60vh] overflow-y-auto">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <label *ngFor="let col of columnConfigs()"
                    class="flex items-center justify-between p-3 rounded-2xl border-2 transition-all cursor-pointer group"
                    [class]="isColumnVisible(col.key) ? 'border-sky-500 bg-sky-50/50 dark:bg-sky-900/10' : 'border-slate-100 dark:border-slate-700 hover:border-slate-200 dark:hover:border-slate-600'">
                    <div class="flex items-center gap-2 min-w-0">
                        <div class="w-8 h-8 rounded-xl bg-white dark:bg-slate-800 shadow-sm flex items-center justify-center text-slate-400 shrink-0"
                            [class.text-sky-500]="isColumnVisible(col.key)">
                            <i class="fas fa-table-columns text-xs"></i>
                        </div>
                        <span
                            class="text-xs font-black text-slate-700 dark:text-slate-200 uppercase tracking-wider truncate" [title]="col.label">{{col.label}}</span>
                    </div>
                    <div class="relative inline-flex items-center cursor-pointer shrink-0">
                        <input type="checkbox" [checked]="isColumnVisible(col.key)" (change)="toggleColumn(col.key)"
                            class="sr-only peer">
                        <div
                            class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all dark:border-gray-600 peer-checked:bg-sky-500">
                        </div>
                    </div>
                </label>
            </div>
        </div>

        <div class="p-8 bg-slate-50 dark:bg-slate-900/50 border-t border-slate-100 dark:border-slate-700">
            <button (click)="saveColumnChanges()"
                class="w-full py-4 bg-sky-500 text-white rounded-2xl font-black shadow-lg shadow-sky-500/30 hover:scale-[1.02] active:scale-95 transition-all uppercase tracking-widest text-xs">
                Guardar Cambios
            </button>
        </div>
    </div>
</div>

<div class="mb-6">

    <div class="flex flex-col md:flex-row items-center justify-between gap-4 my-6">
        <div class="flex-1 md:w-80">
            <app-search-generic [options]="searchOptions" placeholder="Buscar..." (onSearch)="handleSearch($event)">
            </app-search-generic>
        </div>

        <app-primary-button [label]="'Nueva ' + titulo()" icon="plus" color="brand" (btnClick)="abrirModalNuevo()">
        </app-primary-button>
    </div>

    <div class="overflow-hidden">
        <div *ngIf="loading()" class="flex justify-center items-center h-64">
            <div class="text-center">
                <div
                    class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 dark:border-indigo-400">
                </div>
                <p class="mt-4 text-slate-600 dark:text-slate-400 font-medium">Cargando...</p>
            </div>
        </div>

        <div *ngIf="!loading()">
            <app-tabla-general [datos]="items()" [columnas]="columns" [currentPage]="currentPage()"
                [pageSize]="pageSize()" (onEdit)="editar($event)" (onDelete)="eliminar($event)">
            </app-tabla-general>

            <div *ngIf="totalElements() > 0" class="p-4 border-t border-slate-100 dark:border-slate-700">
                <app-pagination [currentPage]="currentPage()" [totalPages]="totalPages()" [pageSize]="pageSize()"
                    (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
                </app-pagination>
            </div>
        </div>
    </div>
</div>

<app-modal [isOpen]="showModal()" [title]="(selectedItem() ? 'Editar ' : 'Nuevo ') + titulo()" [size]="'md'"
    (modalClose)="cerrarModal()">

    <app-atributo-form [visible]="showModal()" [data]="selectedItem()" [titulo]="titulo()" (onClose)="cerrarModal()"
        (onSave)="onGuardar($event)">
    </app-atributo-form>
</app-modal>

<app-header></app-header>

<div class="h-full bg-slate-50 dark:bg-slate-900 pt-16 transition-colors duration-300">
    <app-sidebar></app-sidebar>

    <div [style.padding-left]="($any(sidebarService.isOpen$ | async)) ? '290px' : '20px'"
        class="p-4 md:p-6 min-w-0 transition-all duration-300 ease-in-out">

        <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

        <div
            class="w-full bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700 mb-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div class="bg-blue-100 dark:bg-blue-900/30 p-3 rounded-xl">
                        <i class="fas fa-file-invoice-dollar text-2xl text-blue-600 dark:text-blue-400"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-slate-900 dark:text-white">Kardex Valorizado</h2>
                        <div class="flex items-center gap-4 mt-1">
                            <span class="text-sm font-medium text-slate-500 dark:text-slate-400">
                                CÓDIGO: <b class="text-slate-900 dark:text-slate-200">{{ productoInfo()?.codigo }}</b>
                            </span>
                            <span class="text-sm font-medium text-slate-500 dark:text-slate-400">
                                ARTÍCULO: <b class="text-slate-900 dark:text-slate-200">{{ productoInfo()?.nombre }}</b>
                            </span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <a routerLink="/reportes/stock-valorizado"
                        class="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-600 transition-colors flex items-center gap-2">
                        <i class="fas fa-arrow-left"></i> Volver al Listado
                    </a>
                </div>
            </div>

            <div
                class="grid grid-cols-1 md:grid-cols-4 gap-4 mt-8 pt-6 border-t border-slate-100 dark:border-slate-700">
                <div class="flex flex-col gap-1">
                    <label
                        class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Desde</label>
                    <input type="date" [(ngModel)]="fechaDesde" (change)="onFiltrar()"
                        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div class="flex flex-col gap-1">
                    <label
                        class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Hasta</label>
                    <input type="date" [(ngModel)]="fechaHasta" (change)="onFiltrar()"
                        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div class="flex flex-col gap-1">
                    <label
                        class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Almacén</label>
                    <select
                        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        <option value="">TODOS LOS ALMACENES</option>
                        <option value="1">FARMACIA</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button (click)="onFiltrar()"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-sm shadow-blue-200 dark:shadow-none">
                        <i class="fas fa-search"></i> Buscar
                    </button>
                </div>
            </div>
        </div>

        <div
            class="w-full bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700">
            
            <div *ngIf="!loading() && movimientosRaw.length > 0" class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                <div class="w-full md:w-96">
                    <app-search-generic 
                        placeholder="Buscar por operación, documento..." 
                        [options]="searchOptions"
                        (onSearch)="onSearch($event)">
                    </app-search-generic>
                </div>
                <div class="flex items-center gap-4">
                    <span class="text-sm text-slate-500 dark:text-slate-400">
                        Movimientos: <b>{{ totalElements() }}</b>
                    </span>
                </div>
            </div>

            <app-tabla-general [datos]="movimientosPaginados()" [columnas]="columns" [loading]="loading()" [showEdit]="false"
                [showDelete]="false">
            </app-tabla-general>

            <div *ngIf="!loading() && totalElements() === 0" class="text-center py-16">
                <div
                    class="bg-slate-50 dark:bg-slate-700/50 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-history text-3xl text-slate-400"></i>
                </div>
                <h3 class="text-lg font-medium text-slate-900 dark:text-white">Sin movimientos</h3>
                <p class="text-slate-500 dark:text-slate-400">No se encontraron movimientos registrados en este rango de
                    fechas.</p>
            </div>

            <div *ngIf="!loading() && totalElements() > 0" class="mt-6">
                <app-pagination 
                    [currentPage]="currentPage()" 
                    [pageSize]="pageSize()"
                    [totalPages]="totalPages()" 
                    [pageSizeOptions]="[5, 10, 25, 50]"
                    (pageChange)="cambiarPagina($event)"
                    (pageSizeChange)="cambiarTamanoPagina($event)">
                </app-pagination>
            </div>
        </div>
    </div>
</div>

<app-header></app-header>

<div class="h-full bg-slate-50 dark:bg-slate-900 pt-16 transition-colors duration-300">
    <app-sidebar></app-sidebar>

    <div [style.padding-left]="(sidebarService.isOpen$ | async) ? '290px' : '20px'"
        class="p-4 md:p-6 min-w-0 transition-all duration-300 ease-in-out">

        <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

        <div
            class="w-full bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700">
            <div class="mb-6">
                <app-page-header title="Stock Valorizado" subtitle="Valor monetario del inventario actual por producto"
                    [showCounter]="true" counterLabel="Valor Total" [counterValue]="totalInventario()">
                </app-page-header>

                <div class="overflow-hidden mt-6">
                    <div *ngIf="loading()" class="flex justify-center items-center h-64">
                        <div class="text-center">
                            <div
                                class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 dark:border-blue-400">
                            </div>
                            <p class="mt-4 text-slate-600 dark:text-slate-400 font-medium">Generando reporte...</p>
                        </div>
                    </div>

                    <div *ngIf="!loading()">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                            <div class="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
                                <div class="w-full md:w-64">
                                    <app-searchable-select
                                        [data]="sucursalOptions()" bindLabel="label" bindValue="value" label="Sucursal"
                                        [(ngModel)]="sucursalId"
                                        (ngModelChange)="onSucursalChange($event)">
                                    </app-searchable-select>
                                </div>
                                <div class="w-full md:w-96">
                                    <app-search-generic placeholder="Buscar producto, laboratorio..."
                                        [options]="searchOptions" (onSearch)="onSearch($event)">
                                    </app-search-generic>
                                </div>
                            </div>
                            <div class="flex items-center gap-4">
                                <span class="text-sm text-slate-500 dark:text-slate-400">
                                    Productos: <b>{{ totalElements() }}</b>
                                </span>
                                <div
                                    class="bg-blue-50 dark:bg-blue-900/20 px-4 py-2 rounded-lg border border-blue-100 dark:border-blue-800">
                                    <span class="text-sm font-medium text-slate-600 dark:text-slate-300">Total:</span>
                                    <span class="ml-2 text-base font-bold text-blue-700 dark:text-blue-400">
                                        {{ totalInventario() | currency:'PEN':'S/ ' }}
                                    </span>
                                </div>
                            </div>
                        </div>

                        <app-tabla-general [datos]="datosPaginados()" [columnas]="columns" [showEdit]="false"
                            [showDelete]="false" [showViewDetails]="true" (viewDetails)="verDetalle($event)">
                        </app-tabla-general>

                        <div *ngIf="totalElements() > 0" class="mt-6">
                            <app-pagination [currentPage]="currentPage()" [pageSize]="pageSize()"
                                [totalPages]="totalPages()" [pageSizeOptions]="[5, 10, 25, 50]" (pageChange)="cambiarPagina($event)"
                                (pageSizeChange)="cambiarTamanoPagina($event)">
                            </app-pagination>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<app-header></app-header>

<div class="h-full bg-slate-50 dark:bg-slate-900 pt-16 transition-colors duration-300">
    <app-sidebar></app-sidebar>

    <div [style.padding-left]="(sidebarService.isOpen$ | async) ? '290px' : '20px'"
        class="p-4 md:p-6 min-w-0 transition-all duration-300 ease-in-out">

        <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

        <div
            class="w-full bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700">
            <div class="mb-6">
                <app-page-header title="Gestión de Almacenes" subtitle="Administra los almacenes de la sucursal"
                    [showCounter]="true" counterLabel="Total" [counterValue]="totalElements()">
                </app-page-header>

                <div class="flex flex-col md:flex-row items-center justify-between gap-4 my-6">
                    <div class="w-full md:w-auto flex-1 max-w-lg">
                        <app-search-generic [placeholder]="'Buscar por Nombre, Código...'" [options]="searchOptions"
                            (onSearch)="onSearch($event)">
                        </app-search-generic>
                    </div>
                    <div class="flex items-center gap-2">
                        <app-primary-button label="Nuevo Almacén" icon="plus" color="brand"
                            (btnClick)="abrirModalNuevo()">
                        </app-primary-button>
                    </div>
                </div>

                <div class="overflow-hidden">
                    <div *ngIf="loading()" class="flex justify-center items-center h-64">
                        <div class="text-center">
                            <div
                                class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 dark:border-indigo-400">
                            </div>
                            <p class="mt-4 text-slate-600 dark:text-slate-400 font-medium">Cargando almacenes...</p>
                        </div>
                    </div>

                    <div *ngIf="!loading()">
                        <app-tabla-general [datos]="paginatedAlmacenes()" [columnas]="columns" [showEdit]="true"
                            [showDelete]="true" [currentPage]="currentPage()" [pageSize]="pageSize()"
                            (onEdit)="abrirModalEditar($event)" (onDelete)="eliminar($event)">
                        </app-tabla-general>

                        <div *ngIf="totalElements() > 0" class="p-4 border-t border-slate-100 dark:border-slate-700">
                            <app-pagination [currentPage]="currentPage()" [totalPages]="totalPages()"
                                [pageSize]="pageSize()" (pageChange)="cambiarPagina($event)"
                                (pageSizeChange)="cambiarTamanoPagina($event)">
                            </app-pagination>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<app-modal [isOpen]="showModal()"
    [title]="selectedAlmacen() ? 'Editar Almacén' : 'Nuevo Almacén'"
    [showSucursal]="true"
    [size]="'md'" (modalClose)="cerrarModal()">
    <app-almacen-form [almacen]="selectedAlmacen()" (cerrar)="cerrarModal()" (guardado)="onGuardado()">
    </app-almacen-form>
</app-modal>

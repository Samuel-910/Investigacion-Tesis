<app-header></app-header>

<div class="h-full bg-slate-50 dark:bg-slate-900 pt-16 transition-colors duration-300">
    <app-sidebar></app-sidebar>

    <div [style.padding-left]="(sidebarService.isOpen$ | async) ? '290px' : '20px'"
        class="p-4 md:p-6 min-w-0 transition-all duration-300 ease-in-out">

        <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

        <div
            class="w-full bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700">
            <app-page-header title="Catálogo de Artículos" subtitle="Administra el catálogo de artículos"
                [showCounter]="true" counterLabel="Total" [counterValue]="totalElements()">
            </app-page-header>

            <app-advanced-filter-drawer #filterDrawer [showGlobalSearch]="true"
                searchPlaceholder="Buscar artículos por código, nombre o categoría..." [globalSearchTerm]="searchTerm()"
                (onGlobalSearch)="onGlobalSearch($event)" [showClasificacion]="false" [showFechas]="false"
                [showDocumento]="false" [showOperacion]="false" [showUbicacion]="false" [showEstado]="true"
                [showCatalogo]="true" [categoriaOptions]="categoriaOptions()" (onApplyFilters)="onApplyFilters($event)"
                (activeFiltersCount)="onActiveFiltersCountChange($event)">

                <app-primary-button label="Nuevo Artículo" icon="plus" color="brand" (btnClick)="abrirModalNuevo()">
                </app-primary-button>

            </app-advanced-filter-drawer>

            <div class="overflow-hidden mt-4">
                <div *ngIf="loading()" class="flex justify-center items-center h-64">
                    <div class="text-center">
                        <div
                            class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 dark:border-blue-400">
                        </div>
                        <p class="mt-4 text-slate-600 dark:text-slate-400 font-medium">Cargando catálogo...</p>
                    </div>
                </div>

                <div *ngIf="!loading()">
                    <app-tabla-general [datos]="items()" [columnas]="columns" [showEdit]="true" [showDelete]="true"
                        [currentPage]="currentPage()" [pageSize]="pageSize()" (onEdit)="abrirModalEditar($event)"
                        (onDelete)="eliminar($event)" [showViewDetails]="false">
                    </app-tabla-general>

                    <div *ngIf="totalElements() > 0" class="p-4 border-t border-slate-100 dark:border-slate-700">
                        <app-pagination [currentPage]="currentPage()" [totalPages]="totalPages()"
                            [pageSize]="pageSize()" (pageChange)="cambiarPagina($event)"
                            (pageSizeChange)="cambiarTamanoPagina($event)">
                        </app-pagination>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<app-modal [isOpen]="showModal()" [title]="selectedItem() ? 'Editar Artículo' : 'Nuevo Artículo'" [size]="'4xl'"
    (modalClose)="cerrarModal()" [noPadding]="true">
    <app-catalogo-form [catalogo]="selectedItem()" (cerrar)="cerrarModal()" (guardado)="onGuardado()">
    </app-catalogo-form>
</app-modal>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col relative h-full">

    <div class="px-5 md:px-6 py-5 md:py-6 space-y-6 flex-1">

        <!-- Fila 1: Códigos, Tipo y Nombre -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-start">
            <div class="md:col-span-2">
                <app-form-input label="Código Interno" formControlName="codigo" placeholder="Código" [required]="true"
                    [error]="isFieldInvalid('codigo') ? 'Requerido' : null">
                </app-form-input>
            </div>
            <div class="md:col-span-2">
                <app-form-input label="Tipo Medicamento" formControlName="tipoMedicamento"
                    placeholder="Ej: Jarabe">
                </app-form-input>
            </div>
            <div class="md:col-span-2">
                <app-form-input label="Precio Kairos" type="number" formControlName="precioKairos"
                    placeholder="0.00" icon="fa-solid fa-tag">
                </app-form-input>
            </div>
            <div class="md:col-span-6">
                <app-form-input label="Nombre del Producto" formControlName="nombre"
                    placeholder="Nombre completo del producto" [required]="true"
                    [error]="isFieldInvalid('nombre') ? 'Requerido' : null">
                </app-form-input>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-start">
            <div class="md:col-span-12">
                <app-form-label>Unidades y Presentación</app-form-label>
                <div
                    class="space-y-4 p-4 rounded-xl border-2 border-slate-200 dark:border-slate-500 bg-slate-50 dark:bg-slate-800 mt-1">

                    <!-- Contenedor Grid Principal 4-4-4 -->
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-start relative">

                        <!-- Unidad Base (4 columnas) -->
                        <div class="md:col-span-4">
                            <div class="flex flex-col gap-2 relative">
                                    <div class="flex items-start gap-2">
                                        <div class="flex-1">
                                            <app-searchable-select label="UNIDAD MÍNIMA" placeholder="Seleccione unidad..."
                                                [data]="unidades()" bindLabel="nombre" bindValue="id"
                                                formControlName="idUnidadBase" iconBgColor="bg-blue-500" [required]="true"
                                                [error]="isFieldInvalid('idUnidadBase') ? 'Requerido' : null">
                                                <svg icon class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24"
                                                    stroke="currentColor">
                                                    <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                                                </svg>
                                            </app-searchable-select>
                                        </div>
                                        <button type="button" (click)="abrirQuickUnit('idUnidadBase', false)"
                                            class="p-2.5 bg-blue-50 text-blue-600 hover:bg-blue-100 dark:bg-blue-900/40 dark:text-blue-400 rounded-xl transition-all shadow-sm border border-blue-100 dark:border-blue-800/50 shrink-0"
                                            title="Nueva Unidad">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                                            </svg>
                                        </button>
                                    </div>
                                    <div class="px-0 py-1">
                                        <app-form-input label="Contiene" type="number" [value]="1" [readonly]="true"></app-form-input>
                                    </div>
                                <button *ngIf="!form.get('manejaBlister')?.value" type="button"
                                    (click)="form.get('manejaBlister')?.setValue(true)"
                                    class="w-full justify-center px-3 py-1.5 mt-1 text-xs text-purple-600 border border-purple-200 bg-purple-50 rounded-lg hover:bg-purple-100 dark:bg-purple-900/20 dark:border-purple-800/50 dark:text-purple-400 dark:hover:bg-purple-900/40 flex items-center gap-1.5 font-bold transition-all shadow-sm">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M12 4v16m8-8H4"></path>
                                    </svg>
                                    Añadir Intermedia
                                </button>
                            </div>
                        </div>

                        <!-- Blister / Intermedia (4 columnas) -->
                        <div *ngIf="form.get('manejaBlister')?.value"
                            class="md:col-span-4 pl-0 md:pl-5 border-t md:border-t-0 md:border-l border-slate-200 dark:border-slate-700 relative">
                            <button type="button"
                                (click)="form.get('manejaBlister')?.setValue(false); form.get('manejaCaja')?.setValue(false)"
                                class="absolute -right-2 -top-4 bg-red-50 text-red-500 hover:text-red-700 hover:bg-red-100 dark:bg-red-900/20 dark:text-red-400 dark:hover:bg-red-900/40 dark:hover:text-red-300 rounded-full w-6 h-6 flex items-center justify-center transition-colors z-10 shadow-sm"
                                title="Quitar">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                            <div class="flex flex-col gap-4">
                                <div class="flex items-start gap-2">
                                    <div class="flex-1">
                                        <app-searchable-select label="UNIDAD MEDIO" placeholder="Seleccione..."
                                            [data]="unidades()" bindLabel="nombre" bindValue="id"
                                            formControlName="idUnidadIntermedia" iconBgColor="bg-purple-500" [required]="true"
                                            [error]="isFieldInvalid('idUnidadIntermedia') ? 'Requerido' : null">
                                            <svg icon class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24"
                                                stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                                            </svg>
                                        </app-searchable-select>
                                    </div>
                                    <button type="button" (click)="abrirQuickUnit('idUnidadIntermedia', true)"
                                        class="p-2.5 bg-purple-50 text-purple-600 hover:bg-purple-100 dark:bg-purple-900/40 dark:text-purple-400 rounded-xl transition-all shadow-sm border border-purple-100 dark:border-purple-800/50 shrink-0"
                                        title="Nueva Unidad">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                                        </svg>
                                    </button>
                                </div>
                                <div class="w-1/2">
                                    <app-form-input label="Contiene" type="number" formControlName="factorBlister"
                                        placeholder="Cant." [required]="true"
                                        [error]="isFieldInvalid('factorBlister') ? 'Requerido' : null"></app-form-input>
                                </div>
                                <button *ngIf="!form.get('manejaCaja')?.value" type="button"
                                    (click)="form.get('manejaCaja')?.setValue(true)"
                                    class="w-full justify-center px-3 py-1.5 mt-1 text-xs text-indigo-600 border border-indigo-200 bg-indigo-50 rounded-lg hover:bg-indigo-100 dark:bg-indigo-900/20 dark:border-indigo-800/50 dark:text-indigo-400 dark:hover:bg-indigo-900/40 flex items-center gap-1.5 font-bold transition-all shadow-sm">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M12 4v16m8-8H4"></path>
                                    </svg>
                                    Añadir Caja Mayor
                                </button>
                            </div>
                        </div>

                        <!-- Caja / Mayor (4 columnas) -->
                        <div *ngIf="form.get('manejaCaja')?.value"
                            class="md:col-span-4 pl-0 md:pl-5 border-t md:border-t-0 md:border-l border-slate-200 dark:border-slate-700 relative">
                            <button type="button" (click)="form.get('manejaCaja')?.setValue(false)"
                                class="absolute -right-2 -top-4 bg-red-50 text-red-500 hover:text-red-700 hover:bg-red-100 dark:bg-red-900/20 dark:text-red-400 dark:hover:bg-red-900/40 dark:hover:text-red-300 rounded-full w-6 h-6 flex items-center justify-center transition-colors z-10 shadow-sm"
                                title="Quitar">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                            <div class="flex flex-col gap-4">
                                <div class="flex items-start gap-2">
                                    <div class="flex-1">
                                        <app-searchable-select label="UNIDAD MÁXIMA" placeholder="Seleccione..."
                                            [data]="unidades()" bindLabel="nombre" bindValue="id"
                                            formControlName="idUnidadMayor" iconBgColor="bg-indigo-500" [required]="true"
                                            [error]="isFieldInvalid('idUnidadMayor') ? 'Requerido' : null">
                                            <svg icon class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24"
                                                stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                                            </svg>
                                        </app-searchable-select>
                                    </div>
                                    <button type="button" (click)="abrirQuickUnit('idUnidadMayor', true)"
                                        class="p-2.5 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 dark:bg-indigo-900/40 dark:text-indigo-400 rounded-xl transition-all shadow-sm border border-indigo-100 dark:border-indigo-800/50 shrink-0"
                                        title="Nueva Unidad">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                                        </svg>
                                    </button>
                                </div>
                                <div class="w-2/3">
                                    <app-form-input label="Contiene" type="number" formControlName="factorCaja"
                                        placeholder="Cant." [required]="true"
                                        [error]="isFieldInvalid('factorCaja') ? 'Requerido' : null"></app-form-input>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 pt-4 border-t border-slate-200 dark:border-slate-700">
                        <app-form-input label="Presentación Final" formControlName="presentacion"
                            placeholder="Autogenerado - Ej: CAJA X 100 TABLETAS" [readonly]="true"
                            [required]="!!(form.get('manejaUnidad')?.value || form.get('manejaBlister')?.value || form.get('manejaCaja')?.value)"
                            [error]="isFieldInvalid('presentacion') ? 'Requerido' : null">
                        </app-form-input>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-end">
            <div class="md:col-span-3">
                <app-form-input label="Registro Sanitario" formControlName="regSanitario" placeholder="Nº Registro"
                    [error]="isFieldInvalid('regSanitario') ? 'Requerido' : null">
                </app-form-input>
            </div>
            <div class="md:col-span-3">
                <app-searchable-select label="Principio Activo" placeholder="Buscar..." [data]="principiosActivos()"
                    bindLabel="descripcion" bindValue="id" formControlName="idPrincipioActivo"
                    iconBgColor="bg-emerald-500"
                    [error]="isFieldInvalid('idPrincipioActivo') ? 'Requerido' : null">
                    <svg icon class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </app-searchable-select>
            </div>
            <div class="md:col-span-3">
                <app-searchable-select label="Acción Terapéutica" placeholder="Buscar..."
                    [data]="accionesTerapeuticas()" bindLabel="descripcion" bindValue="id"
                    formControlName="idAccionTerapeutica" iconBgColor="bg-pink-500"
                    [error]="isFieldInvalid('idAccionTerapeutica') ? 'Requerido' : null">
                    <svg icon class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                    </svg>
                </app-searchable-select>
            </div>

            <div class="md:col-span-3">
                <app-searchable-select label="Categoría" placeholder="Buscar..." [data]="categorias()"
                    bindLabel="descripcion" bindValue="id" formControlName="idCategoria" iconBgColor="bg-orange-500"
                    [required]="true" [error]="isFieldInvalid('idCategoria') ? 'Requerido' : null">
                    <svg icon class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
                    </svg>
                </app-searchable-select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-end">
            <div class="md:col-span-4">
                <app-form-label>Tipo de Producto</app-form-label>
                <div class="flex gap-2 mt-1">
                    <label
                        class="flex-1 cursor-pointer rounded-xl border border-slate-200 dark:border-slate-700 p-2.5 text-center transition-all hover:bg-slate-50 dark:hover:bg-slate-800"
                        [class.ring-2]="form.get('esGenerico')?.value === null"
                        [class.ring-blue-500]="form.get('esGenerico')?.value === null"
                        [class.bg-blue-50]="form.get('esGenerico')?.value === null"
                        [class.dark:bg-blue-900/20]="form.get('esGenerico')?.value === null">
                        <input type="radio" formControlName="esGenerico" [value]="null" class="sr-only">
                        <span class="text-sm font-medium text-slate-700 dark:text-slate-300">N/A</span>
                    </label>
                    <label
                        class="flex-1 cursor-pointer rounded-xl border border-slate-200 dark:border-slate-700 p-2.5 text-center transition-all hover:bg-slate-50 dark:hover:bg-slate-800"
                        [class.ring-2]="form.get('esGenerico')?.value === false"
                        [class.ring-blue-500]="form.get('esGenerico')?.value === false"
                        [class.bg-blue-50]="form.get('esGenerico')?.value === false"
                        [class.dark:bg-blue-900/20]="form.get('esGenerico')?.value === false">
                        <input type="radio" formControlName="esGenerico" [value]="false" class="sr-only">
                        <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Marca</span>
                    </label>
                    <label
                        class="flex-1 cursor-pointer rounded-xl border border-slate-200 dark:border-slate-700 p-2.5 text-center transition-all hover:bg-slate-50 dark:hover:bg-slate-800"
                        [class.ring-2]="form.get('esGenerico')?.value === true"
                        [class.ring-blue-500]="form.get('esGenerico')?.value === true"
                        [class.bg-blue-50]="form.get('esGenerico')?.value === true"
                        [class.dark:bg-blue-900/20]="form.get('esGenerico')?.value === true">
                        <input type="radio" formControlName="esGenerico" [value]="true" class="sr-only">
                        <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Genérico</span>
                    </label>
                </div>
            </div>

            <div class="md:col-span-3">
                <app-form-label>Producto Controlado</app-form-label>
                <label
                    class="flex items-center gap-3 cursor-pointer rounded-xl border border-slate-200 dark:border-slate-700 p-2.5 transition-all hover:bg-slate-50 dark:hover:bg-slate-800 mt-1"
                    [class.ring-2]="form.get('esControlado')?.value"
                    [class.ring-blue-500]="form.get('esControlado')?.value"
                    [class.bg-blue-50]="form.get('esControlado')?.value"
                    [class.dark:bg-blue-900/20]="form.get('esControlado')?.value">
                    <input type="checkbox" formControlName="esControlado"
                        class="w-5 h-5 rounded border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 dark:checked:bg-blue-600 text-blue-600 focus:ring-blue-500">
                    <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Controlado</span>
                </label>
            </div>

            <div class="md:col-span-3">
                <app-form-label>Receta</app-form-label>
                <label
                    class="flex items-center gap-3 cursor-pointer rounded-xl border border-slate-200 dark:border-slate-700 p-2.5 transition-all hover:bg-slate-50 dark:hover:bg-slate-800 mt-1"
                    [class.ring-2]="form.get('ventaConReceta')?.value"
                    [class.ring-blue-500]="form.get('ventaConReceta')?.value"
                    [class.bg-blue-50]="form.get('ventaConReceta')?.value"
                    [class.dark:bg-blue-900/20]="form.get('ventaConReceta')?.value">
                    <input type="checkbox" formControlName="ventaConReceta"
                        class="w-5 h-5 rounded border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 dark:checked:bg-blue-600 text-blue-600 focus:ring-blue-500">
                    <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Con Receta</span>
                </label>
            </div>

            <div class="md:col-span-2">
                <app-form-label>Lotes</app-form-label>
                <label
                    class="flex items-center gap-3 cursor-pointer rounded-xl border border-slate-200 dark:border-slate-700 p-2.5 transition-all hover:bg-slate-50 dark:hover:bg-slate-800 mt-1"
                    [class.ring-2]="form.get('manejaLotes')?.value"
                    [class.ring-blue-500]="form.get('manejaLotes')?.value"
                    [class.bg-blue-50]="form.get('manejaLotes')?.value"
                    [class.dark:bg-blue-900/20]="form.get('manejaLotes')?.value">
                    <input type="checkbox" formControlName="manejaLotes"
                        class="w-5 h-5 rounded border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 dark:checked:bg-blue-600 text-blue-600 focus:ring-blue-500">
                    <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Lotes</span>
                </label>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-start">
            <div class="md:col-span-12">
                <app-form-label>Afectación Tributaria (IGV)</app-form-label>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-1">
                    <label
                        class="cursor-pointer rounded-xl border border-slate-200 dark:border-slate-700 p-3 text-center transition-all hover:bg-slate-50 dark:hover:bg-slate-800"
                        [class.ring-2]="form.get('tipoAfectacion')?.value === 'GRAVADO'"
                        [class.ring-blue-500]="form.get('tipoAfectacion')?.value === 'GRAVADO'"
                        [class.bg-blue-50]="form.get('tipoAfectacion')?.value === 'GRAVADO'"
                        [class.dark:bg-blue-900/20]="form.get('tipoAfectacion')?.value === 'GRAVADO'">
                        <input type="radio" formControlName="tipoAfectacion" value="GRAVADO" class="sr-only">
                        <span class="block text-sm font-bold text-slate-900 dark:text-white">Gravado (IGV 18%)</span>
                        <span class="text-xs text-slate-500">Operación onerosa standard</span>
                    </label>

                    <label
                        class="cursor-pointer rounded-xl border border-slate-200 dark:border-slate-700 p-3 text-center transition-all hover:bg-slate-50 dark:hover:bg-slate-800"
                        [class.ring-2]="form.get('tipoAfectacion')?.value === 'EXONERADO'"
                        [class.ring-green-500]="form.get('tipoAfectacion')?.value === 'EXONERADO'"
                        [class.bg-green-50]="form.get('tipoAfectacion')?.value === 'EXONERADO'"
                        [class.dark:bg-green-900/20]="form.get('tipoAfectacion')?.value === 'EXONERADO'">
                        <input type="radio" formControlName="tipoAfectacion" value="EXONERADO" class="sr-only">
                        <span class="block text-sm font-bold text-slate-900 dark:text-white">Exonerado</span>
                        <span class="text-xs text-slate-500">Bienes específicos por ley</span>
                    </label>

                    <label
                        class="cursor-pointer rounded-xl border border-slate-200 dark:border-slate-700 p-3 text-center transition-all hover:bg-slate-50 dark:hover:bg-slate-800"
                        [class.ring-2]="form.get('tipoAfectacion')?.value === 'INAFECTO'"
                        [class.ring-slate-500]="form.get('tipoAfectacion')?.value === 'INAFECTO'"
                        [class.bg-slate-50]="form.get('tipoAfectacion')?.value === 'INAFECTO'"
                        [class.dark:bg-slate-800]="form.get('tipoAfectacion')?.value === 'INAFECTO'">
                        <input type="radio" formControlName="tipoAfectacion" value="INAFECTO" class="sr-only">
                        <span class="block text-sm font-bold text-slate-900 dark:text-white">Inafecto</span>
                        <span class="text-xs text-slate-500">Retiro, bonificaciones, etc.</span>
                    </label>
                </div>
            </div>
        </div>

        <div>
            <app-form-textarea label="Descripción" formControlName="detalle"
                placeholder="Descripción completa del producto..." [rows]="3">
            </app-form-textarea>
        </div>
    </div>

    <div
        class="sticky bottom-0 z-10 bg-white dark:bg-slate-800 flex items-center justify-end gap-3 pt-4 pb-5 md:pb-6 px-5 md:px-6 border-t border-slate-100 dark:border-slate-800 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] dark:shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.2)]">
        <button type="button" (click)="onClose()"
            class="px-5 py-2.5 rounded-xl text-sm font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
            Cancelar
        </button>
        <button type="submit" [disabled]="loading()"
            class="px-6 py-2.5 rounded-xl text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-lg shadow-blue-500/30 disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-2">
            <svg *ngIf="loading()" class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            {{ loading() ? 'Guardando...' : (catalogo?.id ? 'Actualizar' : 'Guardar') }}
        </button>
    </div>
</form>

<!-- Modal de Creación Rápida de Unidades -->
<app-modal [isOpen]="showQuickUnitModal()" title="Nueva Unidad de Medida" (modalClose)="showQuickUnitModal.set(false)">
    <app-unidad-medida-quick-form 
        [esAgrupador]="quickUnitIsAgrupador()" 
        (cerrar)="showQuickUnitModal.set(false)"
        (guardado)="onQuickUnitSaved($event)">
    </app-unidad-medida-quick-form>
</app-modal>

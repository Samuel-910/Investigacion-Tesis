<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6 bg-white dark:bg-slate-800 rounded-3xl">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="md:col-span-2">
            <app-form-input label="Nombre de Sucursal" formControlName="nombreSucursal"
                [error]="getError('nombreSucursal')" [required]="true" [hasIcon]="true"
                placeholder="Ej. Sede Central">
                <i icon class="fas fa-building text-xs"></i>
            </app-form-input>
        </div>

        <app-form-input label="Teléfono" formControlName="telefono" [error]="getError('telefono')" [hasIcon]="true"
            placeholder="Ej. 987654321" [maxlength]="9" type="tel" [onlyNumbers]="true">
            <i icon class="fas fa-phone text-xs"></i>
        </app-form-input>

        <app-form-input label="Celular" formControlName="celular" [error]="getError('celular')" [hasIcon]="true"
            placeholder="Ej. 987654321" [maxlength]="9" type="tel" [onlyNumbers]="true">
            <i icon class="fas fa-mobile-alt text-xs"></i>
        </app-form-input>

        <div class="flex flex-col gap-2">
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider ml-1">Estado</label>
            <div class="flex items-center gap-4 mt-1">
                <label class="flex items-center gap-2 cursor-pointer group">
                    <input type="radio" formControlName="estado" value="ACTIVO"
                        class="w-4 h-4 text-blue-600 focus:ring-blue-500 border-slate-300">
                    <span class="text-sm font-medium text-slate-700 dark:text-slate-300 group-hover:text-blue-600">Activo</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer group">
                    <input type="radio" formControlName="estado" value="INACTIVO"
                        class="w-4 h-4 text-red-600 focus:ring-red-500 border-slate-300">
                    <span class="text-sm font-medium text-slate-700 dark:text-slate-300 group-hover:text-red-600">Inactivo</span>
                </label>
            </div>
        </div>

        <div class="md:col-span-2">
            <app-form-input label="Dirección" formControlName="direccion" [error]="getError('direccion')"
                [hasIcon]="true" placeholder="Ej. Av. Principal 123, Lima">
                <i icon class="fas fa-map-marker-alt text-xs"></i>
            </app-form-input>
        </div>
    </div>

    <div class="flex items-center justify-end gap-3 pt-6 border-t border-slate-100 dark:border-slate-700">
        <button type="button" (click)="cerrar()"
            class="text-sm font-semibold text-slate-500 hover:text-slate-700 transition-colors uppercase tracking-widest">
            Cancelar
        </button>
        <app-primary-button [label]="loading() ? 'Guardando...' : (sucursal ? 'ACTUALIZAR' : 'GUARDAR')"
            [loading]="loading()" color="blue" type="submit">
        </app-primary-button>
    </div>
</form>

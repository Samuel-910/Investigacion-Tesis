<app-header></app-header>

<div class="h-full bg-slate-50 dark:bg-slate-900 pt-16 transition-colors duration-300">
    <app-sidebar></app-sidebar>

    <div [style.padding-left]="(sidebarService.isOpen$ | async) ? '290px' : '20px'"
        class="p-4 md:p-6 min-w-0 transition-all duration-300 ease-in-out">

        <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

        <div
            class="w-full bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700">
            <div class="mb-6">
                <app-page-header title="Gestión de Sucursales"
                    subtitle="Administra las sedes y establecimientos de la clínica" [showCounter]="true"
                    counterLabel="Total" [counterValue]="totalElements()">
                </app-page-header>

                <div class="flex flex-col md:flex-row items-center justify-between gap-4 my-6">
                    <div class="flex-1 md:w-80">
                        <app-search-generic [options]="searchOptions" placeholder="Buscar en la lista..."
                            (onSearch)="handleSearch($event)">
                        </app-search-generic>
                    </div>

                    <app-primary-button label="Nueva Sucursal" icon="plus" color="brand" (btnClick)="abrirModalNuevo()">
                    </app-primary-button>
                </div>

                <div class="overflow-hidden">
                    <div *ngIf="loading()" class="flex justify-center items-center h-64">
                        <div class="text-center">
                            <div
                                class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 dark:border-indigo-400">
                            </div>
                            <p class="mt-4 text-slate-600 dark:text-slate-400 font-medium">Cargando...</p>
                        </div>
                    </div>

                    <div *ngIf="!loading()">
                        <app-tabla-general [datos]="sucursales()" [columnas]="columns" [currentPage]="currentPage()"
                            [pageSize]="pageSize()" (onEdit)="editar($event)" (onDelete)="eliminar($event)">
                        </app-tabla-general>

                        <div *ngIf="totalElements() > 0" class="p-4 border-t border-slate-100 dark:border-slate-700">
                            <app-pagination [currentPage]="currentPage()" [totalPages]="totalPages()"
                                [pageSize]="pageSize()" (pageChange)="onPageChange($event)"
                                (pageSizeChange)="onPageSizeChange($event)">
                            </app-pagination>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<app-modal [showSucursal]="true" [isOpen]="showModal()"
    [title]="selectedSucursal() ? 'Editar Sucursal' : 'Registrar Sucursal'" [size]="'md'"
    (modalClose)="showModal.set(false)">
    <app-sucursal-form [sucursal]="selectedSucursal()" (onSave)="guardarSucursal($event)"
        (onCancel)="showModal.set(false)">
    </app-sucursal-form>
</app-modal>

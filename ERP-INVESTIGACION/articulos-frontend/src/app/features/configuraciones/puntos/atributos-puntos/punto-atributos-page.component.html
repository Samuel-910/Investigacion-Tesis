<app-header></app-header>

<div class="h-full bg-slate-50 dark:bg-slate-900 pt-16 transition-colors duration-300">
    <app-sidebar></app-sidebar>

    <div [style.padding-left]="(sidebarService.isOpen$ | async) ? '290px' : '20px'"
        class="p-4 md:p-6 min-w-0 transition-all duration-300 ease-in-out">

        <app-breadcrumb [items]="breadcrumbItems" [showIcon]="true"></app-breadcrumb>

        <div
            class="w-full bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">

            <div class="px-8 pt-8">
                <app-page-header title="Atributos de Puntos" subtitle="Gestión de tipos y procesos para puntos de venta"
                    iconType="settings" [showCounter]="false">
                </app-page-header>
            </div>

            <div class="px-8 pb-8">
                <div class="flex flex-wrap border-b border-slate-200 dark:border-slate-700 mb-8">
                    <button *ngFor="let tab of tabs" (click)="setActiveTab(tab.id)"
                        class="mr-2 px-6 py-3 text-sm font-semibold transition-all relative" [ngClass]="{
                        'text-blue-600 dark:text-blue-400': activeTab() === tab.id,
                        'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300': activeTab() !== tab.id
                    }">
                        {{ tab.label }}
                        <!-- Active Indicator -->
                        <div *ngIf="activeTab() === tab.id"
                            class="absolute bottom-0 left-0 w-full h-1 bg-blue-600 dark:bg-blue-400 rounded-t-full transition-all duration-300">
                        </div>
                    </button>
                </div>

                <div>
                    <div [ngSwitch]="activeTab()">
                        <app-atributo-list *ngSwitchCase="'TIPOS'" [service]="tipoService" titulo="Tipo de Punto">
                        </app-atributo-list>

                        <app-atributo-list *ngSwitchCase="'PROCESOS'" [service]="procesoService"
                            titulo="Proceso de Punto">
                        </app-atributo-list>
                    </div>
                </div>
            </div>


        </div>
    </div>
</div>

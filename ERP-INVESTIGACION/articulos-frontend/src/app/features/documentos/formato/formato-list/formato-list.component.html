<app-header></app-header>

<div class="h-full bg-slate-50 dark:bg-slate-900 pt-16 transition-colors duration-300">
    <app-sidebar></app-sidebar>

    <div [style.padding-left]="(sidebarService.isOpen$ | async) ? '290px' : '20px'"
        class="p-4 md:p-6 min-w-0 transition-all duration-300 ease-in-out">

        <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

        <div
            class="w-full bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700">
            <div class="mb-6">
                <app-page-header title="Formatos de Documento"
                    subtitle="Administra los tamaños de papel del editor de documentos" [showCounter]="true"
                    counterLabel="Total" [counterValue]="totalRegistros()">
                </app-page-header>

                <div class="flex flex-col md:flex-row items-center justify-between gap-4 my-6">
                    <app-search-generic 
                        [options]="searchOptions" 
                        placeholder="Buscar formatos..."
                        (onSearch)="onSearch($event)">
                    </app-search-generic>

                    <app-primary-button label="Nuevo Formato" icon="plus" color="brand" (btnClick)="abrirModalNuevo()">
                    </app-primary-button>
                </div>

                <div class="overflow-hidden">
                    <div *ngIf="loading()" class="flex justify-center items-center h-64">
                        <div class="text-center">
                            <div
                                class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 dark:border-blue-400">
                            </div>
                            <p class="mt-4 text-slate-600 dark:text-slate-400 font-medium">Cargando formatos...</p>
                        </div>
                    </div>

                    <div *ngIf="!loading()">
                        <app-tabla-general [datos]="formatos()" [columnas]="columns" [showEdit]="true"
                            [showDelete]="true" (onEdit)="abrirModalEditar($event)" (onDelete)="eliminar($event)">
                        </app-tabla-general>

                        <div class="mt-6">
                            <app-pagination 
                                [totalPages]="totalPages()" 
                                [pageSize]="tamanoPagina()"
                                [currentPage]="paginaActual()" 
                                (pageChange)="cambiarPagina($event)"
                                (pageSizeChange)="cambiarTamanoPagina($event)">
                            </app-pagination>
                        </div>

                        <div *ngIf="formatos().length === 0 && !loading()" class="text-center py-16">
                            <div
                                class="bg-slate-50 dark:bg-slate-700/50 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-4">
                                <svg class="h-10 w-10 text-slate-400" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M20 13V6a2 1 0 00-2-2H6a2 1 0 00-2 2v7m16 0v5a2 1 0 01-2 2H6a2 1 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
                                </svg>
                            </div>
                            <h3 class="text-lg font-medium text-slate-900 dark:text-white">No hay formatos</h3>
                            <p class="text-slate-500 dark:text-slate-400">No se encontraron registros.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<app-modal [isOpen]="showModal()" [title]="selectedFormato() ? 'Editar Formato' : 'Nuevo Formato'" [size]="'lg'"
    (modalClose)="cerrarModal()">
    <app-formato-form *ngIf="showModal()" [formato]="selectedFormato()" (cerrar)="cerrarModal()" (guardado)="onGuardado()">
    </app-formato-form>
</app-modal>

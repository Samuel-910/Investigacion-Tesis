<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Formulario -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        @if (error()) {
        <div class="p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm">
            {{ error() }}
        </div>
        }

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="md:col-span-2">
                <app-form-input 
                    formControlName="nombre" 
                    label="Nombre del Bloque"
                    placeholder="Ej: Cabecera Principal" 
                    [required]="true"
                    [hasIcon]="true"
                    [error]="getError('nombre')">
                    <i icon class="fas fa-cube text-xs"></i>
                </app-form-input>
            </div>
            <div>
                <app-form-select 
                    formControlName="categoria" 
                    label="Categoría"
                    [options]="categorias"
                    [required]="true"
                    [error]="getError('categoria')">
                </app-form-select>
            </div>
            <div>
                <app-form-select 
                    formControlName="modulo" 
                    label="Módulo (Opcional)"
                    [options]="modulosOpts">
                </app-form-select>
            </div>
        </div>

        <div>
            <app-form-textarea 
                formControlName="htmlContenido" 
                label="Contenido HTML"
                placeholder="<div class='header'>...</div>" 
                [required]="true"
                [error]="getError('htmlContenido')"
                [rows]="8">
            </app-form-textarea>
        </div>

        <div>
            <app-form-textarea 
                formControlName="cssEstilo" 
                label="Estilos CSS (Opcional)"
                placeholder=".header { color: red; }" 
                [rows]="5">
            </app-form-textarea>
        </div>

        <div class="flex justify-end gap-3 mt-6">
            <button type="button" (click)="onClose()"
                class="px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50">
                Cancelar
            </button>
            <button type="submit" [disabled]="loading() || form.invalid"
                class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
                @if (!loading()) {
                {{ bloque?.id ? 'Actualizar' : 'Guardar' }} Bloque
                } @else {
                Guardando...
                }
            </button>
        </div>
    </form>

    <!-- Vista Previa -->
    <div
        class="flex flex-col border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden bg-slate-50 dark:bg-slate-900/50 min-h-[500px]">
        <div
            class="px-4 py-3 bg-slate-100 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between sticky top-0 z-10">
            <div class="flex items-center gap-2">
                <i class="fas fa-eye text-blue-500 text-xs"></i>
                <span class="text-[10px] font-black uppercase tracking-widest text-slate-500">Vista Previa Real</span>
            </div>
            <div class="flex gap-1.5">
                <div class="w-2.5 h-2.5 rounded-full bg-slate-300 dark:bg-slate-600"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-slate-300 dark:bg-slate-600"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-slate-300 dark:bg-slate-600"></div>
            </div>
        </div>
        <div class="flex-1 overflow-auto p-6 bg-white dark:bg-slate-800 shadow-inner relative">
            <div class="relative" [innerHTML]="previewHtml()"></div>
            @if (!form.get('htmlContenido')?.value) {
            <div class="h-64 flex flex-col items-center justify-center text-slate-400 opacity-40 space-y-3">
                <div class="p-4 bg-slate-50 dark:bg-slate-700/50 rounded-full animate-pulse">
                    <i class="fas fa-code text-5xl"></i>
                </div>
                <p class="text-[10px] uppercase font-black tracking-[0.2em]">Esperando contenido...</p>
            </div>
            }
        </div>
    </div>
</div>

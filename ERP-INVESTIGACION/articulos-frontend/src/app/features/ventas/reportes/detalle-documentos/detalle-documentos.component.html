<app-header></app-header>

<div class="h-full bg-slate-50 dark:bg-slate-900 pt-16 transition-colors duration-300">
    <app-sidebar></app-sidebar>

    <div [style.padding-left]="(sidebarService.isOpen$ | async) ? '290px' : '20px'"
        class="p-4 md:p-6 min-w-0 transition-all duration-300 ease-in-out">

        <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

        <div class="w-full bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700">
            <div class="mb-6">
                <!-- Nuevo título enfocado en Documentos Emitidos -->
                <app-page-header 
                    title="Registro de Documentos Emitidos" 
                    subtitle="Consulta y exporta el detalle de los comprobantes emitidos"
                    iconType="document" 
                    counterLabel="Emitidos"
                    [counterValue]="documentos().length" 
                    [showCounter]="true">
                </app-page-header>
                <app-advanced-filter-drawer #filterDrawer
                    [showFechas]="true"
                    [showDocumento]="true"
                    [showEstado]="true"
                    [showGlobalSearch]="false"
                    [showClasificacion]="false"
                    [showOperacion]="false"
                    [sucursalOptions]="sucursalOptions()"
                    [puntoVentaOptions]="puntoOptions()"
                    [initialSucursalId]="sucursalId()"
                    (onApplyFilters)="onApplyFilters($event)"
                    (activeFiltersCount)="activeFiltersCount.set($event)">
                    
                    <button (click)="exportarExcel()" [disabled]="!documentos().length"
                        class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl transition-colors flex items-center justify-center gap-2 font-medium shadow-sm shadow-emerald-500/20 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-file-excel"></i>
                        <span>Exportar</span>
                    </button>
                    
                </app-advanced-filter-drawer>
            </div>

            <!-- Tabla General -->
            <div class="mb-4">
                <app-tabla-general
                    [columnas]="columnas"
                    [datos]="documentosPaginados()"
                    [loading]="loading()"
                    [selectable]="false"
                    [showEdit]="false"
                    [showDelete]="false"
                    [showActions]="false"
                    [currentPage]="currentPage()"
                    [pageSize]="pageSize()">
                </app-tabla-general>
                
                <div *ngIf="documentos().length > 0" class="mt-4 bg-blue-600 text-white p-4 rounded-xl shadow-inner flex justify-between items-center">
                    <span class="font-medium tracking-wide">TOTAL IMPORTES (VIGENTES):</span>
                    <span class="font-black text-2xl">S/ {{ totalGlobal() | number:'1.2-2' }}</span>
                </div>
            </div>
            
            <!-- Pagination -->
            <div *ngIf="documentos().length > 0" class="mt-4">
                <app-pagination 
                    [currentPage]="currentPage()" 
                    [totalPages]="totalPages()" 
                    [pageSize]="pageSize()"
                    (pageChange)="onPageChange($event)"
                    (pageSizeChange)="onPageSizeChange($event)">
                </app-pagination>
            </div>

            <!-- Resumen por Tipo de Documento -->
            <div *ngIf="totalesPorTipo().length > 0" class="mt-6">
                <h3 class="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 uppercase tracking-wider">
                    Resumen por Tipo de Comprobante
                </h3>
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                    <div *ngFor="let t of totalesPorTipo()" class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-between">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase">{{ t.nombre }}</span>
                                <span class="text-[10px] font-bold text-slate-400 bg-slate-100 dark:bg-slate-700 px-1.5 py-0.5 rounded-full" title="Cantidad">{{ t.cantidad }}</span>
                            </div>
                            <span [ngClass]="t.badgeClass" class="px-1.5 py-0.5 rounded text-[10px] font-bold border">{{ t.tipo === 'NV' ? 'NV' : t.tipo }}</span>
                        </div>
                        <div class="flex items-end justify-between">
                            <span class="text-xl font-black" 
                                  [ngClass]="t.tipo === '07' ? 'text-rose-600 dark:text-rose-400' : 'text-slate-800 dark:text-slate-200'">
                                <span class="text-sm font-medium mr-1 text-slate-400">S/</span>{{ Math.abs(t.total) | number:'1.2-2' }}
                            </span>
                            <span *ngIf="t.tipo === '07'" class="text-[10px] text-rose-500 font-bold mb-1">- Resta</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

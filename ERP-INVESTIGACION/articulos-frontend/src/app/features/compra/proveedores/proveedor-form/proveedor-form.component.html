<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div
        class=" bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-6">

        <!-- Fila 1: Tipo Doc + Num Doc -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <app-form-select label="Tipo Documento" formControlName="tipoDocIdent" [required]="true"
                [options]="tiposDocumento" [error]="isFieldInvalid('tipoDocIdent') ? 'Requerido' : null">
            </app-form-select>
            <app-form-input label="N° Documento" formControlName="numDocIdent" [required]="true"
                [error]="isFieldInvalid('numDocIdent') ? 'Requerido' : null">
            </app-form-input>
        </div>

        <!-- Fila 2: Razón Social + Nombre Comercial -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <app-form-input label="Razón Social" formControlName="razonSocial" [required]="true"
                [error]="isFieldInvalid('razonSocial') ? 'Requerido' : null">
            </app-form-input>
            <app-form-input label="Nombre Comercial" formControlName="nombreComercial">
            </app-form-input>
        </div>

        <!-- Fila 3: Email + Teléfono -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <app-form-input label="Email" formControlName="email" type="email"
                [error]="isFieldInvalid('email') ? 'Email inválido' : null">
            </app-form-input>
            <app-form-input label="Teléfono" formControlName="telefono">
            </app-form-input>
        </div>

        <!-- Fila 4: Ubicación -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <app-form-input label="Departamento" formControlName="departamento"></app-form-input>
            <app-form-input label="Provincia" formControlName="provincia"></app-form-input>
            <app-form-input label="Distrito" formControlName="distrito"></app-form-input>
        </div>

        <!-- Fila Nueva: Plazo de Pago -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <app-form-input label="Plazo de Pago (Días)" formControlName="plazoDias" type="number"
                placeholder="Ej. 15, 30..." [hasIcon]="true">
                <i icon class="fas fa-calendar-alt text-slate-400"></i>
            </app-form-input>
        </div>

        <!-- Fila 5: Estado (Toggle) -->
        <div>
            <app-form-label>Estado</app-form-label>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" formControlName="estado" class="sr-only peer">
                <div
                    class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600">
                </div>
                <span class="ml-3 text-sm font-medium text-gray-900 dark:text-gray-300">
                    {{ form.get('estado')?.value ? 'Activo' : 'Inactivo' }}
                </span>
            </label>
        </div>

        <!-- Error Message -->
        <div *ngIf="error()"
            class="p-4 bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 rounded-xl text-sm font-medium animate-fadeIn">
            {{ error() }}
        </div>

        <!-- Actions -->
        <div class="flex justify-end gap-3 pt-4 border-t border-slate-100 dark:border-slate-800">
            <button type="button" (click)="onClose()"
                class="px-5 py-2.5 rounded-xl text-sm font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                Cancelar
            </button>
            <button type="submit" [disabled]="loading()"
                class="px-6 py-2.5 rounded-xl text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-lg shadow-blue-500/30 disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-2">
                <svg *ngIf="loading()" class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
                {{ loading() ? 'Guardando...' : (proveedor?.id ? 'Actualizar' : 'Guardar') }}
            </button>
        </div>
    </div>
</form>

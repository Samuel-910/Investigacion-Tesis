<app-header></app-header>

<div class="h-full bg-slate-50 dark:bg-slate-900 pt-16 transition-colors duration-300">
    <app-sidebar></app-sidebar>

    <div [style.padding-left]="(sidebarService.isOpen$ | async) ? '290px' : '20px'"
        class="p-4 md:p-6 min-w-0 transition-all duration-300 ease-in-out">

        <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

        <div
            class="w-full bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700">
            <div class="mb-6">
                <app-page-header title="Arqueo de Caja" subtitle="Gestiona las aperturas y cierres de caja"
                    [showCounter]="true" counterLabel="Total" [counterValue]="totalElements()">
                </app-page-header>
                <div class="flex flex-col md:flex-row items-center justify-between gap-4 my-6">
                    <div class="w-full md:w-auto flex-1 max-w-lg">
                        <app-search-generic [placeholder]="'Buscar por nombre de caja...'" [options]="searchOptions"
                            (onSearch)="onSearch($event)">
                        </app-search-generic>
                    </div>
                </div>
            </div>

            <div class="overflow-hidden">

                <div *ngIf="loading()" class="flex justify-center items-center h-64">
                    <div class="text-center">
                        <div
                            class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 dark:border-blue-400">
                        </div>
                        <p class="mt-4 text-slate-600 dark:text-slate-400 font-medium">Cargando cajas...</p>
                    </div>
                </div>

                <div *ngIf="!loading()">
                    <app-tabla-general [datos]="cajas()" [columnas]="columns" [showEdit]="false" [showDelete]="false"
                        [currentPage]="currentPage()" [pageSize]="pageSize()" [accionesTemplate]="accionesTpl">
                    </app-tabla-general>

                    <ng-template #accionesTpl let-item>
                        <div class="flex justify-center gap-0.5">
                            <button (click)="verMovimientos(item)"
                                class="p-1 text-amber-600 dark:text-amber-500 hover:bg-amber-50 dark:hover:bg-amber-900/30 rounded transition-colors"
                                title="Ver Movimientos">
                                <i class="fas fa-list-ul w-4 h-4 flex items-center justify-center"></i>
                            </button>
                            <button *ngIf="item.estado === 'ABIERTA'" (click)="cerrarCaja(item)"
                                class="p-1 text-rose-600 dark:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/30 rounded transition-colors"
                                title="Hacer Arqueo y Cerrar">
                                <i class="fas fa-lock w-4 h-4 flex items-center justify-center"></i>
                            </button>
                        </div>
                    </ng-template>

                    <div *ngIf="totalElements() > 0" class="p-4 border-t border-slate-100 dark:border-slate-700">
                        <app-pagination [currentPage]="currentPage()" [totalPages]="totalPages()"
                            [pageSize]="pageSize()" (pageChange)="cambiarPagina($event)"
                            (pageSizeChange)="cambiarTamanoPagina($event)">
                        </app-pagination>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<app-caja-arqueo-modal [isOpen]="showArqueoModal()" [cajaId]="selectedCajaId()" (modalClose)="onArqueoDone($event)">
</app-caja-arqueo-modal>

<app-caja-movimientos-modal [isOpen]="showMovimientosModal()" [cajaId]="selectedCajaId()"
    (modalClose)="showMovimientosModal.set(false)">
</app-caja-movimientos-modal>

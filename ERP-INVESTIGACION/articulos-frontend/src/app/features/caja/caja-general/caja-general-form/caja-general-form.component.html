<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6 p-1">
    <div class="space-y-4">
        <!-- Tipo de Movimiento -->
        <div class="grid grid-cols-3 gap-4">
            <label *ngFor="let tipo of tiposMovimiento"
                class="relative flex flex-col items-center justify-center p-4 rounded-2xl border-2 cursor-pointer transition-all duration-300"
                [class.border-blue-500]="form.get('tipo')?.value === tipo.value"
                [class.bg-blue-50]="form.get('tipo')?.value === tipo.value"
                [class.border-slate-100]="form.get('tipo')?.value !== tipo.value"
                [class.hover:border-slate-200]="form.get('tipo')?.value !== tipo.value"
                [class.dark:bg-blue-900/10]="form.get('tipo')?.value === tipo.value"
                [class.dark:border-blue-500/50]="form.get('tipo')?.value === tipo.value">
                <input type="radio" formControlName="tipo" [value]="tipo.value" class="absolute opacity-0">
                <div [class]="tipo.bg + ' ' + tipo.color"
                    class="w-12 h-12 rounded-xl flex items-center justify-center mb-2 shadow-sm transition-transform duration-300"
                    [class.scale-110]="form.get('tipo')?.value === tipo.value">
                    <i class="fas" [class]="tipo.icon"></i>
                </div>
                <span class="text-[10px] font-black uppercase tracking-wider text-center" [class]="tipo.color">{{ tipo.label }}</span>
                <div *ngIf="form.get('tipo')?.value === tipo.value"
                    class="absolute -top-2 -right-2 w-6 h-6 bg-blue-500 text-white rounded-full flex items-center justify-center shadow-lg animate-in zoom-in duration-300">
                    <i class="fas fa-check text-[10px]"></i>
                </div>
            </label>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-2">
            <div class="space-y-1">
                <app-searchable-select
                    formControlName="metodoPago"
                    [label]="form.get('tipo')?.value === 'TRANSFERENCIA_ENTRE_METODOS' ? 'Método Origen' : 'Método de Pago'"
                    [data]="metodoPagoOrigenOptions()"
                    bindLabel="label"
                    bindValue="value"
                    [required]="true">
                </app-searchable-select>
                <div class="flex items-center gap-1.5 px-1 animate-in fade-in slide-in-from-top-1 duration-300" *ngIf="form.get('metodoPago')?.value">
                    <div class="w-1.5 h-1.5 rounded-full" [class.bg-emerald-500]="saldoDisponible() > 0" [class.bg-rose-500]="saldoDisponible() <= 0"></div>
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-tight">
                        Disponible: <span class="text-slate-900 dark:text-white">S/ {{ saldoDisponible() | number:'1.2-2' }}</span>
                    </span>
                </div>
            </div>

            <app-searchable-select *ngIf="form.get('tipo')?.value === 'TRANSFERENCIA_ENTRE_METODOS'"
                formControlName="metodoPagoDestino"
                label="Método Destino"
                [data]="metodoPagoDestinoOptions()"
                bindLabel="label"
                bindValue="value"
                [required]="true"
                [error]="form.get('metodoPagoDestino')?.touched && form.get('metodoPagoDestino')?.invalid ? 'Campo requerido' : null"
                class="animate-in slide-in-from-right duration-300">
            </app-searchable-select>

            <!-- Monto -->
            <app-form-input
                formControlName="monto"
                label="Monto"
                type="number"
                [step]="0.01"
                [required]="true"
                prefix="S/"
                [error]="form.get('monto')?.touched && form.get('monto')?.invalid ? 'Monto inválido' : null">
            </app-form-input>

            <!-- Referencia -->
            <app-form-input
                formControlName="referencia"
                label="Referencia"
                [hasIcon]="true"
                [placeholder]="'Opcional'"
                class="md:col-span-1">
                <i icon class="fas fa-hashtag"></i>
            </app-form-input>
        </div>

        <!-- Descripción -->
        <app-form-textarea
            formControlName="descripcion"
            label="Descripción / Motivo"
            [required]="true"
            [rows]="2"
            [error]="form.get('descripcion')?.touched && form.get('descripcion')?.invalid ? 'Descripción muy corta (mín. 5)' : null">
        </app-form-textarea>
    </div>

    <!-- Botones de Acción -->
    <div class="flex items-center justify-end gap-4 pt-6 mt-4 border-t border-slate-100 dark:border-slate-700">
        <button type="button" (click)="onCancel()"
            class="px-8 py-3 rounded-2xl border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 font-bold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all">
            Cancelar
        </button>
        <app-primary-button [label]="isEdit ? 'Actualizar Movimiento' : (form.get('tipo')?.value === 'TRANSFERENCIA_ENTRE_METODOS' ? 'Ejecutar Transferencia' : ('Registrar ' + (form.get('tipo')?.value === 'INGRESO' ? 'Ingreso' : 'Egreso')))"
            icon="save" [color]="form.get('tipo')?.value === 'INGRESO' ? 'green' : (form.get('tipo')?.value === 'TRANSFERENCIA_ENTRE_METODOS' ? 'brand' : 'red')" [loading]="loading()"
            type="submit">
        </app-primary-button>
    </div>
</form>
